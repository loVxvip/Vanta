
name: Сборка VANTA VISUALS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Распаковать архив
        run: |
          mkdir -p project
          unzip -q VANTA-VISUALS-RU.zip -d project

      - name: Найти проект
        run: |
          SETTINGS=$(find project -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Проект не найден"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Исправить совместимость Java и Kotlin
        run: |
          APP_GRADLE=$(find project -type f -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "Не найден app/build.gradle.kts"
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Собрать APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-VISUALS-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
