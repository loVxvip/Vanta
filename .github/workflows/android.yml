
name: Сборка VANTA VISUALS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Поиск ZIP-архива
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-архив не найден"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Поиск Gradle Wrapper
        run: |
          WRAPPER=$(find project -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ОШИБКА: файл gradlew не найден."
            echo "Проверь, что ZIP содержит Android-проект."
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Найден Gradle Wrapper: $WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Сборка APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохранение APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-VISUALS-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
